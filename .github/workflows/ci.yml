name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
      - name: Baseline parsing eval
        run: teewatch evals --agent baseline

  live-smoke:
    # Hits the real TeeItUp API (read-only, a handful of requests). Informational: an outage
    # at the course's booking provider shouldn't fail the build.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: teewatch courses
      - run: teewatch check --dry-run

  claude-evals:
    # Manual only: spends API credits. Needs the ANTHROPIC_API_KEY repo secret.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Claude parsing eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          teewatch evals --agent claude | tee evals.md
          cat evals.md >> "$GITHUB_STEP_SUMMARY"
